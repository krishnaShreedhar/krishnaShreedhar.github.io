version: "3.9"

services:
  probability_statistics:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: probability-statistics:latest
    container_name: probability_statistics_analysis
    volumes:
      # Mount outputs and logs so they persist on the host
      - ../outputs:/app/outputs
      - ../logs:/app/logs
    environment:
      - PYTHONPATH=/app/src:/app
      - PYTHONUNBUFFERED=1
    command: ["python", "src/sql_analytics/sql_statistics.py"]

  descriptive_stats:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: probability-statistics:latest
    container_name: descriptive_stats_analysis
    volumes:
      - ../outputs:/app/outputs
      - ../logs:/app/logs
    environment:
      - PYTHONPATH=/app/src:/app
      - PYTHONUNBUFFERED=1
    command: ["python", "src/descriptive_stats/statistics_calculator.py"]

  hypothesis_testing:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: probability-statistics:latest
    container_name: hypothesis_testing_analysis
    volumes:
      - ../outputs:/app/outputs
      - ../logs:/app/logs
    environment:
      - PYTHONPATH=/app/src:/app
      - PYTHONUNBUFFERED=1
    command: ["python", "src/hypothesis_testing/test_runner.py"]

  bayesian_ab:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: probability-statistics:latest
    container_name: bayesian_ab_analysis
    volumes:
      - ../outputs:/app/outputs
      - ../logs:/app/logs
    environment:
      - PYTHONPATH=/app/src:/app
      - PYTHONUNBUFFERED=1
    command: ["python", "src/bayesian_analysis/bayesian_ab_test.py"]

  jupyter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: probability-statistics:latest
    container_name: probability_statistics_jupyter
    ports:
      - "8888:8888"
    volumes:
      - ../:/app
    environment:
      - PYTHONPATH=/app/src:/app
      - JUPYTER_ALLOW_INSECURE_WRITES=1
    command: >
      jupyter notebook
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=''
      --NotebookApp.password=''
      --notebook-dir=/app/src/notebooks
