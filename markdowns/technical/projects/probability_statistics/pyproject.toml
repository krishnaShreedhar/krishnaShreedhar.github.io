[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probability-statistics"
version = "0.1.0"
description = "Probability & Statistics concepts illustrated with minimal working code, SQL techniques, and visualisations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Numerical computing
    "numpy>=1.26.0",
    # Scientific / statistical computing
    "scipy>=1.13.0",
    # Data manipulation
    "pandas>=2.2.0",
    # Visualisation
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    # SQL analytical engine (in-process)
    "duckdb>=1.0.0",
    # Configuration
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.1.0",
    "ipykernel>=6.29.5",
    "nbformat>=5.10.0",
]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
