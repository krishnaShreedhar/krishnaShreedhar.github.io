[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "python-engg-templates"
version = "0.1.0"
description = "Python engineering patterns: collections, logging, concurrency, design patterns, production templates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shreedhar Kodate" }]

dependencies = [
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "aiofiles>=23.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "jupyter>=1.0",
    "cachetools>=5.3",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "black>=23.0", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
