[project]
name = "cuda-programming-tutorials"
version = "0.1.0"
description = "CUDA and cuDNN programming tutorial notebooks and utilities"
requires-python = ">=3.10"

dependencies = [
    "jupyterlab>=4.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
