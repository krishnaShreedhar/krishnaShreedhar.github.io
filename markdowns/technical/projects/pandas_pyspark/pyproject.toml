[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pandas-pyspark-demo"
version = "0.1.0"
description = "Minimal working examples illustrating Pandas and PySpark concepts: core operations, performance optimization, ML pipelines, and interoperability."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.2",
    "pyspark>=3.5",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "polars>=0.20",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
