[project]
name = "kafka-event-driven"
version = "0.1.0"
description = "Kafka and event-driven architecture examples"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.3.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
