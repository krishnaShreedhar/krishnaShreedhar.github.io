algorithm: sac
use_case: autonomous_vehicle

logging:
  level: INFO

training:
  max_episodes: 3000
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  replay_start: 1000
  auto_entropy: true
  target_entropy: -2.0

buffer:
  capacity: 100000

env:
  name: vehicle_env
  num_obstacles: 5
  obstacle_radius: 0.08
  goal_threshold: 0.05
  max_speed: 0.05
  max_steering: 0.5
  max_accel: 0.1
  dt: 0.1
  vehicle_radius: 0.03
  reward_goal: 100.0
  reward_collision: -10.0
  reward_step: -0.01
  reward_progress_scale: 1.0
  random_start: true
  random_goal: true
  max_episode_steps: 500

network:
  state_dim: 7
  action_dim: 2
  hidden_dims: [256, 256]
  action_scale: 1.0
  log_std_min: -20
  log_std_max: 2
