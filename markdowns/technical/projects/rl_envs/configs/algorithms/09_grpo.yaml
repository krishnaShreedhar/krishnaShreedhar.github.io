algorithm: grpo
use_case: vlm_finetuning

logging:
  level: INFO

training:
  max_episodes: 5000
  learning_rate: 0.0001
  gamma: 1.0
  group_size: 8
  clip_epsilon: 0.2
  n_epochs: 1
  kl_coef: 0.04
  batch_size: 64

env:
  name: vlm_env
  num_questions: 1000
  embedding_dim: 128
  num_choices: 4
  reward_correct: 1.0
  reward_wrong: -0.5
  use_synthetic_data: true
  max_episode_steps: 1

network:
  input_dim: 128
  action_dim: 4
  hidden_dims: [256, 128]
