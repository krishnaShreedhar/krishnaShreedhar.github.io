algorithm: dqn
use_case: path_planning

logging:
  level: INFO

training:
  max_episodes: 1500
  batch_size: 64
  learning_rate: 0.001
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay_steps: 10000
  target_update_freq: 500
  replay_start: 1000
  save_interval: 200

buffer:
  capacity: 50000

env:
  name: grid_world
  grid_size: 10
  num_obstacles: 10
  max_episode_steps: 200
  reward_goal: 10.0
  reward_wall: -1.0
  reward_step: -0.01

network:
  input_dim: 4
  output_dim: 4
  hidden_dims: [128, 128]
