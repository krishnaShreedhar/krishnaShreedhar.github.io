algorithm: td3
use_case: autonomous_vehicle

logging:
  level: INFO

training:
  max_episodes: 2000
  actor_lr: 0.001
  critic_lr: 0.001
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  replay_start: 1000
  policy_noise: 0.2
  noise_clip: 0.5
  policy_delay: 2

buffer:
  capacity: 100000

env:
  name: vehicle_env
  max_episode_steps: 500

network:
  state_dim: 7
  action_dim: 2
  hidden_dims: [400, 300]
  action_scale: 1.0
