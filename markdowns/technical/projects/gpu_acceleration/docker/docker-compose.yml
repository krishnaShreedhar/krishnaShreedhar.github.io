services:
  gpu-acceleration:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: gpu-acceleration:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ../logs:/workspace/logs
      - ../configs:/workspace/configs
    shm_size: "8gb"   # required for multi-GPU NCCL communication
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
