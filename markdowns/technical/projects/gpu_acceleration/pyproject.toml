[project]
name = "gpu-acceleration"
version = "0.1.0"
description = "Minimal tutorials for Transformer GPU training and inference"
requires-python = ">=3.11"

dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "nvidia-ml-py>=12.535.77",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
